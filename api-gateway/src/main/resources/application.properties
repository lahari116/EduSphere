server.port=8087
 
spring.application.name=api-gateway
 
# COURSE SERVICE
spring.cloud.gateway.routes[0].id=course-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/courses/**
 
# ENROLLMENT SERVICE
spring.cloud.gateway.routes[1].id=enrollment-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/enrollments/**
 
# ASSIGNMENT SERVICE
spring.cloud.gateway.routes[2].id=assignment-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/assignments/**
 
# IDENTITY SERVICE
spring.cloud.gateway.routes[3].id=identity-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**
 
# NOTIFICATION SERVICE
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**
 
# PROGRESS SERVICE
spring.cloud.gateway.routes[5].id=progress-service
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/progress/**
