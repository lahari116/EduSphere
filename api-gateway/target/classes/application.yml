server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/admin/**

        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/v1/courses/**, /api/v1/departments/**

        - id: enrollment-service
          uri: lb://enrollment-service
          predicates:
            - Path=/api/v1/enrollments/**, /api/v1/students/*/enrollments/**, /api/v1/instructors/*/enrollments/**

        - id: assignment-service
          uri: lb://assignment-service
          predicates:
            - Path=/api/v1/assignments/**, /api/v1/submissions/**

        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/api/v1/exams/**

        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/api/v1/students/*/attendance/**, /api/v1/courses/*/attendance/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**, /api/v1/reports/**

        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/v1/audit/**, /api/v1/compliance/**, /api/v1/gdpr/**

        - id: progress-service
          uri: lb://assignment-service
          predicates:
            - Path=/api/v1/students/*/progress/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: edusphere-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm

management:
  endpoints:
    web:
      exposure:
        include: health,info,routes
