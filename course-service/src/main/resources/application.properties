spring.application.name=course-service
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/edusphere_course_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sony2005

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.validator.apply_to_ddl=true
spring.jpa.properties.hibernate.validator.autoregister_listeners=true

# JSON
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.default-property-inclusion=NON_NULL

# Error handling & validation
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha